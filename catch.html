<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ホーム猫のキャッチ</title><style>*{box-sizing:border-box}body{margin:0;background:#c6dbd4;font-family:system-ui;color:#193d45;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;inset:20px 20px auto;display:flex;justify-content:space-between;align-items:center;pointer-events:none}small{letter-spacing:.16em;font-size:10px}h1{font-size:20px;margin:6px 0}button,a{pointer-events:auto;border:1px solid #244b5033;background:#fff9;color:#244b50;border-radius:30px;padding:12px;text-decoration:none;font-size:15px}footer{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;pointer-events:none}#hint{display:inline-block;border-radius:24px;background:#173d49e8;color:white;padding:12px 20px;font-size:14px}#score{font-size:14px}dialog{max-width:340px;border:0;border-radius:24px;padding:26px;background:#f2f5e9;color:#193d45;line-height:1.8}dialog::backdrop{background:#173d4988}</style><canvas aria-label="ボールを上へフリックして投げ、画面をドラッグして猫を動かすキャッチゲーム"></canvas><header><div><small>CAT PHYSICS / PLAY TEST</small><h1>ホーム猫のキャッチ</h1><div id="score">● ○ ○</div></div><nav><a href="train.html?compare=1&v=67">駅</a> <button id="help">？</button><button id="reset">↻</button></nav></header><footer><span id="hint">ボールから上へフリック</span></footer><dialog><h2>投げて、追いかけて、キャッチ</h2><p>猫の手元のボールを上へフリック。飛んでいる間は、画面を左右にドラッグして猫を動かします。</p><p>落ちてくるボールに手を合わせると自動キャッチ。3回キャッチするとクリア。斜めにも投げられます。</p><p>今回はホームでの投げ受けの試作です。時計や光の比較は含みません。</p><button id="close">遊ぶ</button></dialog><script src="catch.js"></script></html>
