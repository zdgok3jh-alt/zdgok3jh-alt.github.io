</style></head><body><header><span>05 / EINSTEIN · 山の駅 ― 光と競争</span><nav><a href="./wind.html?v=63" aria-label="観測所へ">⌂</a><button id="reset" aria-label="やり直す">↻</button><button id="helpButton" aria-label="操作ヘルプ">？</button></nav></header><section id="help" hidden><div class="card"><h1>光と競争</h1><p>猫と光が、列車の後ろから先頭まで競争。まず予想を選んでから開始。</p><p>上は車内、下はホームから見た同じ競争。スライダーで時間を進めたり戻したりできる。</p><p>ゆっくり・速いの2レースでクリア。</p><small>速さを誇張した模型です。猫の速さは車内で光の0.45倍。</small><br><button id="closeHelp">戻る</button></div></section><section id="ending" hidden><div class="card"><small>05 / 山の駅 · 光と競争 · CLEAR</small><h1>光は、追い越せない。</h1><p>光の速さは、どちらの立場でも同じ。猫の速さは、足し算どおりには伸びなかった。</p><p>次は、この光を時計に仕立てる実験へ。</p><a href="./train.html?v=67">光時計の実験へ →</a><button id="continue">もう一度見る</button><a href="./wind.html?v=63">観測所へ戻る</a></div></section><div id="error" hidden>画面を開けませんでした。</div><script type="module" src="train-race.mjs?v=1"></script></body></html>
