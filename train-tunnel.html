</style></head><body><header><span>05 / EINSTEIN · 山の駅 ― 収縮トンネル</span><nav><a href="./wind.html?v=63" aria-label="観測所へ">⌂</a><button id="reset" aria-label="やり直す">↻</button><button id="helpButton" aria-label="操作ヘルプ">？</button></nav></header><section id="help" hidden><div class="card"><h1>収縮トンネル</h1><p>列車の長さは 6。トンネルは少し短い。まず収まるか予想して、速さを選んで走らせる。</p><p>判定はホームから見た長さ。車内に切り替えると、縮むのはトンネルの方に見える。トンネル3本、全部収まるとクリア。</p><small>速度を誇張した模型です。</small><br><button id="closeHelp">戻る</button></div></section><section id="ending" hidden><div class="card"><small>05 / EINSTEIN · 章完了</small><h1>長さも、立場で決まる。</h1><p>車内では列車はいつも 6。短くなったのは、ホームから測った長さだけ。</p><p>次の章では、「見る」行為そのものが結果に割り込んでくる。</p><button id="continue">もう一度見る</button><a href="./wind.html?v=63">観測所へ戻る</a></div></section><div id="error" hidden>画面を開けませんでした。</div><script type="module" src="train-tunnel.mjs?v=1"></script></body></html>
